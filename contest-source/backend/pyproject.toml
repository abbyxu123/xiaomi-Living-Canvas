[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-canvas-decision-backend"
version = "0.1.0"
description = "Independent decision and phone-handoff backend for Living Canvas"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.100",
  "httpx>=0.24",
  "pydantic>=2.5",
  "uvicorn>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
